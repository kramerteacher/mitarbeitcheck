<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selbsteinschätzung Mitarbeit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- INTRO SCREEN -->
  <div id="screen-intro" class="screen active">
    <div class="intro-wrap">
      <div class="intro-icon">✦</div>
      <h1>Selbsteinschätzung<br><span>Mitarbeit</span></h1>
      <p class="intro-sub">Schätze deine eigene Mitarbeit anhand von sechs Kategorien ein. Am Ende erhältst du eine Gesamtnote.</p>
      <div class="name-field">
        <label for="student-name">Dein Name <span class="optional">(freiwillig)</span></label>
        <input type="text" id="student-name" placeholder="Vorname Nachname" autocomplete="off" />
      </div>
      <button class="btn-primary" id="btn-start">Einschätzung starten</button>
    </div>
  </div>

  <!-- CATEGORY SCREENS (generated by JS) -->
  <div id="screen-category" class="screen">
    <header class="top-bar">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="cat-current">1</span> / <span id="cat-total">6</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <div class="category-content">
      <div class="cat-eyebrow" id="cat-eyebrow">Kategorie</div>
      <h2 class="cat-title" id="cat-title">Titel</h2>

      <div class="cards-grid" id="cards-grid">
        <!-- Karten werden per JS eingefügt -->
      </div>
    </div>

    <footer class="nav-bar">
      <button class="btn-ghost" id="btn-back">← Zurück</button>
      <button class="btn-primary" id="btn-next" disabled>Weiter →</button>
    </footer>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="screen">
    <div class="result-wrap">
      <div class="result-header">
        <div class="result-icon">★</div>
        <h2>Deine Selbsteinschätzung</h2>
        <p id="result-name-display" class="result-name"></p>
      </div>

      <div class="overall-grade-box">
        <div class="overall-label">Gesamtnote</div>
        <div class="overall-grade" id="overall-grade">–</div>
        <div class="overall-grade-text" id="overall-grade-text"></div>
      </div>

      <div class="breakdown" id="breakdown">
        <!-- Einzelkategorien -->
      </div>

      <div class="result-actions">
        <button class="btn-primary" id="btn-print">🖨 Drucken / Als PDF speichern</button>
        <button class="btn-ghost" id="btn-share">🔗 Link kopieren</button>
        <button class="btn-ghost" id="btn-restart">↩ Neu starten</button>
      </div>

      <div class="share-toast" id="share-toast">Link kopiert!</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
